<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Osama Khan — Full Stack Developer</title>
    <meta
      name="description"
      content="Portfolio of Osama Khan, a Full Stack Developer building modern, responsive web applications."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <script>
      // Runs before React mounts and before first paint, so the correct
      // theme class is already on <html> and there's no flash of the
      // wrong theme. Mirrors the logic in src/context/ThemeContext.jsx:
      // a saved preference always wins; otherwise fall back to system.
      (function () {
        try {
          var saved = localStorage.getItem("theme");
          var theme =
            saved === "light" || saved === "dark"
              ? saved
              : window.matchMedia("(prefers-color-scheme: light)").matches
              ? "light"
              : "dark";
          if (theme === "light") {
            document.documentElement.classList.add("light");
          }
        } catch (e) {
          // localStorage unavailable (privacy mode, etc.) — dark default applies.
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
